name: PR Checks

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
  
jobs:
  deps-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  test:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Environment
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          # We use uv run to ensure pytest uses the resolved workspace environment
          uv run pytest --cov=src --cov-report=xml --cov-fail-under=80 -v

      - name: Archive Code Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

      - name: Validate ClickHouse SQL Syntax
        run: |
          # Uses the official ClickHouse image to check SQL files for syntax errors
          find . -name "*.sql" | while read -r file; do
            echo "Checking $file..."
            docker run --rm -v "$(pwd)/$file:/tmp/query.sql" clickhouse/clickhouse-server \
              clickhouse-format --query "$(cat $file)" > /dev/null
          done
