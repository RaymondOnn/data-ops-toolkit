name: CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options: [ dev, prod ]

jobs:
  list-apps:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      release_id: ${{ steps.set-matrix.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix # Combined matrix discovery and release ID generation
        run: |
          # Auto-discover apps that contain a src directory
          APPS=$(find apps -maxdepth 2 -name "src" | cut -d'/' -f2 | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$APPS" >> $GITHUB_OUTPUT
          echo "release_id=$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  package-artifacts:
    needs: list-apps
    runs-on: self-hosted
    strategy:
      matrix:
        app: ${{ fromJson(needs.list-apps.outputs.matrix) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
      LOCALSTACK_URL: "http://localhost:4566"
    steps:
      - uses: actions/checkout@v4

      - name: Build PEX Artifacts
        uses: ./.github/actions/build-pex
        with:
          app_name: ${{ matrix.app }}
          python-version: '3.11'

      - name: Stage Artifacts with Rsync
        run: |
          # Use rsync to create a clean 'dist' folder.
          # -a: archive mode, -v: verbose, --update: only copy if source is newer
          mkdir -p ./dist/${{ matrix.app }}
          rsync -av --update deps.pex ${{ matrix.app }}.pex ./dist/${{ matrix.app }}/
          
          echo "### 📂 Staging Summary" >> $GITHUB_STEP_SUMMARY
          ls -lh ./dist/${{ matrix.app }} >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📊 PEX Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 **Dependencies** (deps.pex) | $(du -h deps.pex | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 **Application Code** (${{ matrix.app }}.pex) | $(du -h ${{ matrix.app }}.pex | cut -f1) |" >> $GITHUB_STEP_SUMMARY

      - name: Upload to LocalStack S3
        run: |
          # S3 Path: s3://deployments/<app_name>/<release_id>/...
          S3_PATH="s3://deployments/${{ matrix.app }}/${{ needs.list-apps.outputs.release_id }}"
          
          aws s3 mb s3://deployments --endpoint-url $LOCALSTACK_URL || true
          aws s3 sync ./dist/${{ matrix.app }} $S3_PATH --endpoint-url $LOCALSTACK_URL

      - name: Verify S3 Integrity with Rsync
        run: |
          S3_PATH="s3://deployments/${{ matrix.app }}/${{ needs.list-apps.outputs.release_id }}"
          mkdir -p ./s3_verify
          
          echo "📥 Downloading artifacts from S3 for verification..."
          aws s3 cp $S3_PATH ./s3_verify --recursive --endpoint-url $LOCALSTACK_URL
          
          echo "🔍 Running rsync checksum verification..."
          # -i (itemize) outputs a code like '>f..t....' if there's a difference.
          # If the output is empty, the folders are identical.
          DIFFS=$(rsync -rvnc --delete --itemize-changes ./dist/${{ matrix.app }}/ ./s3_verify/ | grep -v 'sending list' || true)
          
          if [ -n "$DIFFS" ]; then
            echo "❌ Verification Failed! S3 content does not match local dist."
            echo "Differences found:"
            echo "$DIFFS"
            exit 1
          else
            echo "✅ S3 Integrity Verified via Checksum. Ready for deployment."
            echo "### 🛡️ S3 Integrity Check: PASSED" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup Old S3 Releases
        run: |
          echo "🧹 Cleaning up old releases in S3 (keeping last 5)..."
          # List folders, sort them, skip the last 5, and delete the rest
          OLD_RELEASES=$(aws s3 ls s3://deployments/${{ matrix.app }}/ --endpoint-url $LOCALSTACK_URL | awk '{print $2}' | sort -r | tail -n +6)
          
          for RELEASE in $OLD_RELEASES; do
            echo "Deleting old release: $RELEASE"
            aws s3 rm s3://deployments/${{ matrix.app }}/$RELEASE --recursive --endpoint-url $LOCALSTACK_URL
          done
          
          echo "✅ S3 Cleanup complete." >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: [list-apps, package-artifacts]
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment || 'production' }}
    strategy:
      matrix:
        app: ${{ fromJson(needs.list-apps.outputs.matrix) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
      # Inside a container on Mac, host.docker.internal reaches the host's localhost
      LOCALSTACK_INTERNAL_URL: "http://host.docker.internal:4566"
      WORKER_CONTAINER: "ingestion-worker"

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Access
        uses: ./.github/actions/setup-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          port: 2222 # Explicitly pass the mapped port

      - name: Verify SSH Connection
        run: |
          chmod +x ./scripts/verify_ssh.sh
          ./scripts/verify_ssh.sh ${{ secrets.SSH_USER }} ${{ secrets.SSH_HOST }} 22

      - name: Trigger Pull and Run on App Server
        run: |
          RELEASE_ID="${{ needs.list-apps.outputs.release_id }}"
          S3_URI="s3://deployments/${{ matrix.app }}/$RELEASE_ID"
          DEPLOY_DIR="/opt/deploy/${{ matrix.app }}/$RELEASE_ID"

          # Passing variables into the SSH command to ensure the remote shell is authenticated
          ssh -p 2222 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -s" << EOF
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
            
            mkdir -p $DEPLOY_DIR
            
            echo "📥 Remote host pulling artifacts from S3..."
            aws s3 cp $S3_URI $DEPLOY_DIR --recursive --endpoint-url $LOCALSTACK_INTERNAL_URL
            
            echo "🔗 Updating global dependency symlink..."
            # Create a stable symlink for the deps.pex
            ln -sfn $DEPLOY_DIR/deps.pex /opt/deploy/current_deps.pex
            
            echo "🏃 Running application..."
            # PEX_PATH is already set in the Dockerfile ENV, so we just run the app
            python3 $DEPLOY_DIR/${{ matrix.app }}.pex
          EOF

      - name: Post-Deployment Health Check
        run: |
          APP_NAME="${{ matrix.app }}"
          # Assuming your app has a simple HTTP endpoint or a --version flag
          # Replace with actual health check logic for your app
          echo "🩺 Running post-deployment health check for $APP_NAME..."
          # Example: SSH into the container and run a command to verify app status
          # For a simple PEX, you might just check its version or a specific output
          ssh -p 2222 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "python3 /opt/deploy/$APP_NAME/${{ matrix.app }}.pex --version" || {
            echo "❌ Health check failed for $APP_NAME!"
            exit 1
          }
          echo "✅ Health check passed for $APP_NAME."

      - name: Cleanup Old Releases on Server
        run: |
          APP_NAME="${{ matrix.app }}"
          RELEASES_PATH="/opt/deploy/$APP_NAME"
          
          echo "🧹 Cleaning up old releases on remote server (keeping last 5)..."
          # List directories, sort by name (which includes timestamp), keep the last 5, and delete the rest
          ssh -p 2222 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -s" << EOF
            if [ -d "$RELEASES_PATH" ]; then
              cd $RELEASES_PATH
              # Get all release directories, sort them, and delete all but the newest 5
              ls -d */ | sort | head -n -5 | xargs -r rm -rf
              echo "✅ Old releases cleaned up."
            else
              echo "No release directory found at $RELEASES_PATH to clean up."
            fi
          EOF

      - name: Notify Success
        run: echo "✅ ${{ matrix.app }} deployed successfully."

  tag-release:
    needs: deploy
    if: github.event.inputs.environment == 'production'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Create Production Tag
        run: |
          TAG="prod-${{ needs.list-apps.outputs.release_id }}"
          git tag $TAG
          git push origin $TAG