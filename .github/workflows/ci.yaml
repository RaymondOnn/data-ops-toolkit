name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Static Analysis & Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Crucial: checkout must use a ref or fetch-depth: 0 to push back easily
          fetch-depth: 0

      - name: Initialize Environment
        uses: ./.github/actions/setup-uv
        with:
          python-version-file: "cicd/python.version"
          uv-version-file: "cicd/uv.version"


      # - name: Verify PEX Reproducibility
      #   env:
      #     PEX_DETERMINISTIC_BINARIES: 1
      #   run: |
      #     # We build a generic PEX to ensure the bundling logic is sound
      #     uv run pex . -o build1.pex --no-index -D libs/utils
      #     uv run pex . -o build2.pex --no-index -D libs/utils
      #     sha256sum build1.pex build2.pex
      #     diff build1.pex build2.pex

      - name: Run pip-audit
        run: uv run pip-audit

      - name: Run Ty (Type Check)
        # ty reads the [tool.pyright] section in pyproject.toml automatically.
        # Do not pass "." as an argument.
        run: uv run ty

  scan-secrets:
    name: Scan Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Set to true if you want to scan the entire history
          fail: false
