name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Static Analysis & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Environment
        uses: ./.github/actions/setup-uv
        with:
          python-version-file: "cicd/python.version"

      - name: Auto-fix Lint & Format
        continue-on-error: true
        # This automates the resolution of simple issues identified by Ruff
        run: |
          uv run ruff check --fix .
          uv run ruff format .

      - name: Commit and Push Auto-fixes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Check if there are changes before attempting to commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: auto-fix linting and formatting"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Run Ty (Type Check)
        continue-on-error: true
        # Ty/Pyright catches logic mismatches that cannot be auto-fixed
        run: uv run ty .


      # - name: Verify PEX Reproducibility
      #   env:
      #     PEX_DETERMINISTIC_BINARIES: 1
      #   run: |
      #     # We build a generic PEX to ensure the bundling logic is sound
      #     uv run pex . -o build1.pex --no-index -D libs/utils
      #     uv run pex . -o build2.pex --no-index -D libs/utils
      #     sha256sum build1.pex build2.pex
      #     diff build1.pex build2.pex
      
      - name: Run pip-audit
        run: uv run pip-audit

  scan-secrets:
    name: Scan Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Set to true if you want to scan the entire history
          fail: false
