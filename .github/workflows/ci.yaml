name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Static Analysis & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Environment
        uses: ./.github/actions/setup-uv
        with:
          python-version: '3.11'

      - name: Run Ruff (Lint & Format)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run Pyright (Type Check)
        run: uv run pyright .

      # - name: Verify PEX Reproducibility
      #   env:
      #     PEX_DETERMINISTIC_BINARIES: 1
      #   run: |
      #     # We build a generic PEX to ensure the bundling logic is sound
      #     uv run pex . -o build1.pex --no-index -D libs/utils
      #     uv run pex . -o build2.pex --no-index -D libs/utils
      #     sha256sum build1.pex build2.pex
      #     diff build1.pex build2.pex
      
      - name: Run pip-audit
        run: uv run pip-audit

  scan-secrets:
    name: Scan Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Set to true if you want to scan the entire history
          fail: false
