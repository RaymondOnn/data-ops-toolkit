jobs:
  list-apps:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          APPS=$(ls .deploy/ | sed 's/\.yaml//' | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$APPS" >> $GITHUB_OUTPUT

  build-and-deploy:
    needs: list-apps
    strategy:
      matrix:
        app: ${{ fromJson(needs.list-apps.outputs.matrix) }}
    steps:
      - name: Build PEX for ${{ matrix.app }}
        run: |
          uv export --format requirements.txt > requirements.txt
          pex -r requirements.txt -o releases/deps-${{ hashFiles('uv.lock') }}.pex
          pex . -o releases/app-${{ github.sha }}.pex --no-index


name: Build PEX Artifacts

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/ingestion/src/**'
      - 'libs/**'
      - 'uv.lock'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      force_deps:
        description: 'Force rebuild deps.pex'
        type: boolean
        default: false

jobs:
  build-pex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff to work

      - name: Install uv and pex
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          pip install pex

      - name: Check for dependency changes
        id: check_deps
        run: |
          # Compare current commit with the previous one
          # If uv.lock or pyproject.toml changed, set 'rebuild=true'
          if git diff --name-only HEAD^ HEAD | grep -E 'uv.lock|pyproject.toml'; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
          fi
          # Note: This only checks the last commit. For a more robust solution, consider comparing with the main branch or a specific tag.

      - name: Build deps.pex
        if: steps.check_deps.outputs.rebuild == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          uv export --no-dev --project apps/ingestion --format requirements.txt > requirements.txt
          sed -i '/-e/d' requirements.txt
          pex -r requirements.txt \
              --platform manylinux2014_x86_64-cp-311-cp311 \
              -o deps.pex \
              --runtime-pty \
              --python-shebang="/usr/bin/env python3"

      - name: Build ingestion.pex
        run: |
          pex --sources-directory apps/ingestion/src \
              --sources-directory libs/utils \
              --sources-directory libs/auth \
              --sources-directory libs/database \
              --sources-directory libs/file \
              --no-pypi \
              --entry-point apps.ingestion.__main__:app \
              -o ingestion.pex \

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pex-artifacts
          path: |
            deps.pex
            ingestion.pex
