name: 'Python Environment Setup'
description: 'Standardized setup for Python monorepo using official actions'
inputs:
  python-version:
    description: 'Python version to use (either direct version or path to version file)'
    required: false
    default: ''
  python-version-file:
    description: 'Path to file containing Python version'
    required: false
    default: 'cicd/python.version'
  uv-version:
    description: 'uv version to use (either direct version or path to version file)'
    required: false
    default: ''
  uv-version-file:
    description: 'Path to file containing uv version'
    required: false
    default: 'cicd/uv.version'

runs:
  using: "composite"
  steps:
    - name: Resolve Python version
      id: python-version
      shell: bash
      run: |
        if [ -f "${{ inputs.python-version-file }}" ]; then
          VERSION=$(cat "${{ inputs.python-version-file }}" | tr -d '\n\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [ -n "${{ inputs.python-version }}" ]; then
          echo "version=${{ inputs.python-version }}" >> $GITHUB_OUTPUT
        else
          echo "Error: No Python version provided and version file not found"
          exit 1
        fi

    - name: Resolve uv version
      id: uv-version
      shell: bash
      run: |
        if [ -f "${{ inputs.uv-version-file }}" ]; then
          VERSION=$(cat "${{ inputs.uv-version-file }}" | tr -d '\n\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [ -n "${{ inputs.uv-version }}" ]; then
          echo "version=${{ inputs.uv-version }}" >> $GITHUB_OUTPUT
        else
          echo "Error: No uv version provided and version file not found"
          exit 1
        fi

    - name: Set up Python ${{ steps.python-version.outputs.version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.python-version.outputs.version }}
        cache: 'pip'

    - name: Bootstrap uv
      shell: bash
      run: |
        python -m pip install uv==${{ steps.uv-version.outputs.version }}

    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Sync Project Dependencies
      shell: bash
      run: uv sync --all-extras --dev
