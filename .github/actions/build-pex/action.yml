name: 'Build PEX'
description: 'Builds dependency and application PEX files'
inputs:
  app_name:
    description: 'Name of the app to build'
    required: true
  force_rebuild_deps:
    description: 'Force rebuild of deps.pex'
    default: 'false'
  python-version:
    description: 'Python version to use for the build'
    default: '3.11'

runs:
  using: "composite"
  steps:
    - name: Initialize Environment
      uses: ./.github/actions/setup-uv
      with:
        python-version: ${{ inputs.python-version }}
        uv-version-file: "cicd/uv.version"

    - name: Install PEX Builder
      shell: bash
      run: uv pip install pex

    - name: Cache Dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: deps.pex
        key: pex-deps-${{ inputs.app_name }}-${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}

    - name: Build deps.pex
      if: steps.cache-deps.outputs.cache-hit != 'true' || inputs.force_rebuild_deps == 'true'
      shell: bash
      run: |
        uv export --no-dev --project apps/${{ inputs.app_name }} --format requirements.txt > requirements.txt
        sed -i '/-e/d' requirements.txt

        # Building the Dependency Bundle (deps.pex):
        # -r: Bundles all requirements listed in the exported file.
        # --platform: Forces the build to target the Linux environment used by the Docker worker.
        # -o: Sets the output filename for the heavy dependency layer.
        # --runtime-pty: Supports pseudo-terminals for tools that require interactive output.
        # --python-shebang: Ensures the PEX uses the standard system python3 at runtime.
        uv run pex -r requirements.txt \
            --platform manylinux2014_x86_64-cp-${{ replace(inputs.python-version, '.', '') }}-cp${{ replace(inputs.python-version, '.', '') }} \
            -o deps.pex \
            --runtime-pty \
            --python-shebang="/usr/bin/env python3"

    - name: Build app.pex
      shell: bash
      env:
        PEX_DETERMINISTIC_BINARIES: 1
      run: |
        # Robust discovery of library source directories
        LIB_DIRS=$(find libs -maxdepth 1 -mindepth 1 -type d | xargs -I {} echo "--sources-directory {}")

        # Building the Application layer (app.pex):
        # --sources-directory: Includes the specific source code for the target application.
        # --no-pypi: Prevents fetching external deps (ensures this PEX stays lightweight and relies on deps.pex).
        # --entry-point: Defines the specific main function to execute when the file is run.
        uv run pex --sources-directory apps/${{ inputs.app_name }}/src \
            $LIB_DIRS \
            --no-pypi \
            --entry-point apps.${{ inputs.app_name }}.__main__:main \
            -o ${{ inputs.app_name }}.pex
