[project]
name = "utils"
version = "0.1.0"
description = "Shared I/O and Database clients"
dependencies = [
    "loguru",
    "pendulum",
    "httpx",
    "pypac",
    "psutil>=5.8.0",
    "httptap",
    "faker",
]
requires-python = ">=3.11"

[tool.setuptools]
packages = ["utils"]
package-dir = { "utils" = "." }
