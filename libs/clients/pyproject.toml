[project]
name = "clients"
version = "0.1.0"
description = "Shared I/O and Database clients"
dependencies = [
    "clickhouse_connect",
    "polars",
    "oracledb",
    "adbc_driver_snowflake",
    "adbc_driver_postgresql",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]