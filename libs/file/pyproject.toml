[project]
name = "file"
version = "0.1.0"
description = "Shared I/O and Database clients"
dependencies = [
    "fsspec",
    "polars",
    "charset-normalizer",
    "xmltodict",
    "s3fs",
    "adlfs",
    "gcsfs",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]