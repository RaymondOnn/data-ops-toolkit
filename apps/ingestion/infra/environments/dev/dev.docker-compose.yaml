version: '3.8'

services:
  localstack:
    container_name: localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"            # Edge Port (S3, Secrets Manager, etc.)
      - "4510-4559:4510-4559"  # External services range
    environment:
      - SERVICES=s3,secretsmanager
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh"

  clickhouse:
    # container_name: clickhouse-dev
    # image: clickhouse/clickhouse-server:latest
    build:
      context: ./clickhouse
      dockerfile: Dockerfile
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-password}
      - CH_HOST=localhost
      - LOCALSTACK_HOST=localstack
    volumes:
      - ../../../sql:/sql
      - ./clickhouse/clickhouse_settings.xml:/etc/clickhouse-server/config.d/clickhouse_settings.xml
      - ./clickhouse/cron_next_function.xml:/etc/clickhouse-server/cron_next_function.xml
      - ./clickhouse/udf:/var/lib/clickhouse/user_scripts:ro
      # Named volume touse the native Linux filesystem (ext4) inside the Docker VM that supports RENAME_EXCHANGE operation
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:       
      nofile:
        soft: 262144
        hard: 262144

  app-server:
    container_name: app-server
    build:
      # Set context to the directory containing the Dockerfile and deploy_key.pub
      context: .
      dockerfile: Dockerfile
    ports:
      - "2222:22"
    extra_hosts:
      - "host.docker.internal:host-gateway"