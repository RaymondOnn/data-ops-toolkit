services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    # container_name: clickhouse-dev
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
    volumes:
      - ../../../sql/definitions:/sql
      - ./tmp/clickhouse/data:/var/lib/clickhouse
      # - ./clickhouse/init_databases.sh:/docker-entrypoint-initdb.d/init_databases.sh
      - ./clickhouse/clickhouse_settings.xml:/etc/clickhouse-server/config.d/clickhouse_settings.xml
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "password", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ch_ntw

  clickhouse-init:
    image: clickhouse/clickhouse-server:latest
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CH_HOST=clickhouse
    volumes:
      - ./clickhouse/init_databases.sh:/init_databases.sh
      - ../../../sql/definitions:/sql
    depends_on:
      - clickhouse
    networks:
      - ch_ntw
    entrypoint: /bin/bash
    command: /init_databases.sh

  # S3 replacement
