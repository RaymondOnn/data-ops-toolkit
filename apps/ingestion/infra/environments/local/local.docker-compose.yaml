services:
  clickhouse:
    # container_name: clickhouse-dev
    # image: clickhouse/clickhouse-server:latest
    build:
      context: ./clickhouse
      dockerfile: Dockerfile
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CH_HOST=localhost
      - LOCALSTACK_HOST=localstack
    volumes:
      - ../../../sql:/sql
      - ./clickhouse/init_databases.sh:/docker-entrypoint-initdb.d/init_databases.sh
      - ./clickhouse/clickhouse_settings.xml:/etc/clickhouse-server/config.d/clickhouse_settings.xml
      - ./clickhouse/cron_next_function.xml:/etc/clickhouse-server/cron_next_function.xml
      - ./clickhouse/udf:/var/lib/clickhouse/user_scripts
      - ./.tmp/clickhouse:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:       
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - ch_ntw

