services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    # container_name: clickhouse-dev
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
    volumes:
      - ../../../sql/definitions:/sql
      - ./tmp:/var/lib/clickhouse/user_files/tmp
      # - ./clickhouse/init_databases.sh:/docker-entrypoint-initdb.d/init_databases.sh
      # - ./clickhouse/clickhouse_settings.xml:/etc/clickhouse-server/config.d/clickhouse_settings.xml
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "password", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ch_ntw

  clickhouse-init:
    image: clickhouse/clickhouse-server:latest
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CH_HOST=clickhouse
    volumes:
      - ./clickhouse/init_databases.sh:/init_databases.sh
      - ../../../sql/definitions:/sql
    depends_on:
      - clickhouse
    networks:
      - ch_ntw
    entrypoint: /bin/bash
    command: /init_databases.sh

  # S3 replacement
  # garage:
  #   image: dxflrs/garage:v1.1.0 # Use a specific version for stability
  #   container_name: garage
  #   restart: unless-stopped
  #   ports:
  #     - "3900:3900" # S3 API
  #     - "3901:3901" # RPC (for cluster communication)
  #     - "3902:3902" # S3 Web (optional)
  #     - "3903:3903" # Admin API
  #   volumes:
  #     - ./garage.toml:/etc/garage.toml:ro
  #     - ./garage-meta:/var/lib/garage/meta
  #     - ./garage-data:/var/lib/garage/data
  #   environment:
  #     - RUST_LOG=garage=info

networks:
  ch_ntw:
    driver: bridge
