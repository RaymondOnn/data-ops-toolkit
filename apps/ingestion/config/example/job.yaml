
# JOB-LEVEL CONFIG (Applies to all datasets in this job)
job:
  name: daily_ingestion_sync # job_id
  raw:
    num_workers: 16
  archive:
    enable_archival: true
    service_ref: "s3_archive"  # archive_type

datasets:
  # DATASET 1: Standard 50M row import
  orders: # dataset_id
    partition_date:
      offset:
        days: -1
        months: 0
        years: 0
      format: "%Y-%m-%d"
      wrap_quotes: false
    extract:
      service_ref: "postgres" # for credential lookup
      load_mode: delta # Loading Strategy: delta | snapshot
      source_params:
        batch_size: 100000

        # file source
        type: file
        file_pattern: "s3://bucket/path/orders_{{partition_date}}.csv"

        # Database Source
        type: database
        table_name: "production.orders"
        # For delta load mode
        filter_condition: "status = 'COMPLETED' AND updated_at >= {{partition_date}}"

        # API Source
        type: api
        endpoint: "example.com/v1/orders"
        query_params:
          include_deleted: false
          region: "EMEA"
      schema_file: "orders.csv"

    # Note: defaults to DefaultTransformer if type is not specified
    transform:
      # Example for bitmask transformer
      type: bitmask
      params:
        column_bitmasks:
          - "order_id": 1
          - "customer_id": 2
          - "order_date": 4
          - "total_amount": 8
          - "status": 16

      # Example for custom transformer
      type: custom
      params:
        # Lazy-loaded custom Python logic
        script: "src.workflows.finance.currency_conversion"
        # add more params here

      # Example for no transformer
      type: none
      params:

    load:
      service_ref: "clickhouse"
      sink_params:
        destination: "TEST.ORDERS" # file: "s3://bucket/processed/orders/"



    # audit:
    #   # Threshold-based checks
    #   allow_missing_percent: 0.02
    #   # Row-level logic
    #   expectations:
    #     - "amount <= 1000000" # Flag outliers
    #     - "order_date <= today()"
    #   # Action on failure
    #   on_failure: "quarantine" # options: abort | warn | quarantine

  # DATASET 2: Sensitive Financials (Requires CAS Vault)
  ledger_entries:
    partitions:
      column: updated_at
      units: days
      offset: -2
      format: "YYYY-MM-DD"
      wrap_quotes: true
    raw:
      source_type: "api"
      resource: "/v1/ledger"
      load_mode: snapshot
      params:
        query_params:
          include_deleted: false
          region: "EMEA"
      schema_file: "ledger.csv"

    transform:
      type: custom
      params:
        script: "src.workflows.finance.currency_conversion"

    load:
      type: clickhouse
      destination: "ledger_entries"
      params:

    # OVERRIDE: Specific archival for this dataset
    archive:
      archive_type: "cas_archive"
      retention_days: 3650 # 10 years for finance

  # DATASET 3: Temporary Log data (No Archival)
  internal_logs:
    partitions:
      column: updated_at
      units: days
      offset: -2
      format: "YYYY-MM-DD"
      wrap_quotes: true
    raw:
      source_type: "api"
      resource: "/v1/logs"
      load_mode: snapshot
      params:
        query_params:
          include_deleted: false
          region: "EMEA"
      schema_file: "logs.csv"

    transform:
      type: custom
      params:
        script: "src.workflows.finance.currency_conversion"

    load:
      type: clickhouse
      destination: "internal_logs"
      params:

    archive:
      enable_archival: false
