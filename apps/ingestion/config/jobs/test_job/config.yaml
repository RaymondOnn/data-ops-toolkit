# apps/ingestion/config/test_job/config.yaml

# ── Task-level defaults (apply to all datasets in this job) ──────────────────
default:
  job:
    extract:
      service_ref: mock_data_folder
    transform:
      type: default
    load:
      service_ref: clickhouse
    num_workers: 1
    archive:
      enable_archival: true
      service_ref: "s3_archive"

    # Job-level feature flag overrides
    feature_flags:
      archive_first: true # Use case: Archive to S3 before loading to DB
      benchmark_mode: false
      experimental_sink_type: null
      experimental_config: {}

  # ── Datasets (each key = dataset_id, values override job defaults) ─────────
  datasets:
    orders:
      mode: "append"
      primary_keys: [order_id]
      steps:
        - id: extract_orders_data
          stage: extract
          resource:
            object: sample_orders.csv
            service_ref: mock_data_folder
            glob:
          hooks:
            post:
              - id: archive_src_files
                type: copy
                from:
                  service_ref: mock_data_folder
                  path: sample_orders.csv
                  # path: "@format {this.datasets.orders.extract.object}"
                to:
                  service_ref: s3_archive
                  # path: "{job_id}/{partition_date}/{run_id}/raw/"
                  path: s3://archive-vault/{job_id}/{partition_date}/{run_id}/raw
                on_failure: abort # abort | warn | skip
                single_file: true
                timeout_secs:

              # - id: cleanup_src_file
              #   type: delete
              #   location: sample_orders.csv
              #   # location: "@format {this.datasets.orders.extract.object}"
              #   recursive: true
              #   on_failure: warn

          num_workers: 1 # overrides job-level num_workers if different
          select:
            - order_id as ORDER_ID
            - customer_id AS CUSTOMER_ID
            - order_date AS ORDER_DATE
            - amount AS AMOUNT
            - status AS STATUS
            # exclude updated_at
          add_source_audit_column: true

        - id: normalize_orders_data
          stage: transform
          steps:
            - id: create_audit_columns
              type: sql
              sources:
                raw_orders: extract_orders_data
              cte:
                - name: data_with_audit_cols
                  sql:
                  from: raw_orders
                  select:
                    - ORDER_ID
                    - CUSTOMER_ID
                    - ORDER_DATE
                    - AMOUNT
                    - STATUS
                    - "'{run_id}' AS _RUN_ID"
                    - "'{partition_date}' AS _PARTITION"

        - id: load_orders_data
          stage: write
          service_ref: clickhouse
          hooks: []
          params:
            type: database
            destination: TEST.ORDERS

        # - id: archive_orders_data
        #   stage: archive
        #   service_ref: s3_archive
        #   hooks:
        #     post:
        #       - id: cleanup_archived_files
        #         type: delete
        #         location:
        #           service_ref: s3_archive
        #   enable_archival: true # per-dataset archival override
        #   service_ref: "s3_archive"

      # Dataset-level override for cost comparison
      feature_flags:
        benchmark_mode: true
        experimental_sink_type: "snowflake_db"
        experimental_config:
          warehouse: "XSMALL"

