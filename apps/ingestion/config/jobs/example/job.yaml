# JOB-LEVEL CONFIG (Applies to all datasets in this job)
job:
  name: daily_ingestion_sync # job_id
  source: # table name / file name /
    service_ref: "some_folder" # for credential lookup


  target:
    service_ref: "clickhouse"
    column_case_type: upper
    column_case_style: snake


  extract:
    num_workers: 16
  archive:
    enable_archival: true
    service_ref: "s3_archive" # archive_type

datasets:
  # DATASET 1: Standard 50M row import
  orders: # dataset_id

    mode: delta # Loading Strategy: delta (update_key) | append | truncate | cdc | backfill
    update_key:
    primary_key: []
    meta_columns:
      run_id: "_run_id"
      run_date: "_partition"
      source: "_source"  # source identifier / file path
      loaded_at: "_loaded_at_ts"

    steps:
      - id: extract_orders_data
        stage: extract
        object: "s3://bucket/path/orders_{{partition_date}}.csv"

        # ---- FILE ----
        glob: "s3://bucket/path/orders_{{partition_date}}.csv"
        header: # true | false
        skip_blank_lines:
        encoding:

        # ---- API ----
        endpoint:
        headers:
        params:
          include_deleted: false
          region: "EMEA"

        sql:
        select: []
        where: "status = 'COMPLETED' AND updated_at >= {{partition_date}}"
        limit:
        batch_size: 100000
        null_if:
        flatten:
        column_types: # schema override
          col1: dtype1
          col2: dtype2

        hooks:
          pre:
            - id: archive file
              type: copy
              from:
                service_ref:
                path:
              to:
                service_ref:
                path:
              on_failure: # abort | warn | skip
              timeout_secs:
          post:
            - id: cleanup
              if: archive_file.success()
              type: delete
              location:
              recursive: true
              on_failure:


        file_pattern: "s3://bucket/path/orders_{{partition_date}}.csv"
      - id: normalize
        stage: transform
        steps:
          # Sub-step 1: SQL transform referencing Extract Step 1
          - id: clean_orders
            type: sql
            sources:
              raw_orders: extract_orders
            cte:
              - name: formatted_orders
                sql:
                from: raw_orders
                select: ["order_id", "user_id", "amount"]

          # Sub-step 2: Custom Python transform referencing Extract Step 2
          - id: enrich_users
            type: custom
            sources:
              raw_users: extract_users
            module_path: "my_project.processors.users.clean_user_data"
            params:
              filter_inactive: true

          # Sub-step 3: SQL transform joining the outputs of Sub-step 1 and Sub-step 2
          - id: join_orders_and_users
            type: sql
            sources:
              # References internal intermediate outputs from previous sub-steps!
              clean_orders_data: clean_orders
              enrich_users_data: enrich_users
            cte:
              - name: final_dataset
                from: clean_orders_data
                join:
                  table: enrich_users_data
                  on: "clean_orders_data.user_id = enrich_users_data.id"
                  type: inner
                select: ["*"]

      - id: stage_orders_data
        stage: load
        object: "TEST.ORDERS" # file: "s3://bucket/processed/orders/"
        source:

        add_new_columns: true # default to false
        create_table_ddl:
        write_strategy: skeleton_clone        # Creates working_table & loads data
        working_table: TEST.ORDERS_CLONE_V1   # Isolated workspace/clone
        use_bulk: true  # batched INSERTS if false
        column_types:

      - id: promote_to_prod
        stage: publish
        staging_location: "{steps.stage_orders_data.working_table}"
        target: "{dataset.target}"
        promote_to_target: true
        merge_strategy: # delete_insert / merge_upsert
        soft_delete_missing: # hard | soft


    # audit:
    #   # Threshold-based checks
    #   allow_missing_percent: 0.02
    #   # Row-level logic
    #   expectations:
    #     - "amount <= 1000000" # Flag outliers
    #     - "order_date <= today()"
    #   # Action on failure
    #   on_failure: "quarantine" # options: abort | warn | quarantine
