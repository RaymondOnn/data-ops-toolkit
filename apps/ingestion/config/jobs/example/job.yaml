
# JOB-LEVEL CONFIG (Applies to all datasets in this job)
job:
  name: daily_ingestion_sync # job_id
  raw:
    num_workers: 16
  archive:
    enable_archival: true
    service_ref: "s3_archive"  # archive_type

datasets:
  # DATASET 1: Standard 50M row import
  orders: # dataset_id
    mode: delta # Loading Strategy: delta (update_key) | append | truncate | cdc
    partition_on:


    extract:
      object: # table name / file name /
        name: "s3://bucket/path/orders_{{partition_date}}.csv"
        service_ref: "postgres" # for credential lookup

        # ---- FILE ----
        glob:
        header: # true | false
        skip_blank_lines:
        encoding:

        # ---- API ----
        endpoint:
        headers:
        params:
          include_deleted: false
          region: "EMEA"

      hooks:
        pre: []

        post:
          - id: archive file
            typw: copy
            from:
              service_ref:
              path:
            to:
              service_ref:
              path:
            on_failure: # abort | warn | skip
            timeout_secs:

          - id: cleanup
            if: archive_file.success()
            type: delete
            location:
            recursive: true
            on_failure:


      sql:
      select: []
      where: "status = 'COMPLETED' AND updated_at >= {{partition_date}}"
      limit:
      columns: # schema override
        col1: dtype1
        col2: dtype2
      batch_size: 100000
      null_if:
      flatten:

      file_pattern: "s3://bucket/path/orders_{{partition_date}}.csv"

    # Note: defaults to DefaultTransformer if type is not specified
    transform:
      # Example for bitmask transformer
      type: bitmask
      params:
        column_bitmasks:
          - "order_id": 1
          - "customer_id": 2
          - "order_date": 4
          - "total_amount": 8
          - "status": 16

      # Example for custom transformer
      type: custom
      params:
        # Lazy-loaded custom Python logic
        script: "src.workflows.finance.currency_conversion"
        # add more params here

      # Example for no transformer
      type: none
      params:

    load:
      object: "TEST.ORDERS" # file: "s3://bucket/processed/orders/"
      service_ref: "clickhouse"
      add_new_columns: # true / false

      hooks:
        pre:

        post:




    publish:
      object:
      primary_key: []
      delete_missing: # hard | soft



    # audit:
    #   # Threshold-based checks
    #   allow_missing_percent: 0.02
    #   # Row-level logic
    #   expectations:
    #     - "amount <= 1000000" # Flag outliers
    #     - "order_date <= today()"
    #   # Action on failure
    #   on_failure: "quarantine" # options: abort | warn | quarantine

  # DATASET 2: Sensitive Financials (Requires CAS Vault)
  ledger_entries:
    partitions:
      column: updated_at
      units: days
      offset: -2
      format: "YYYY-MM-DD"
      wrap_quotes: true
    raw:
      source_type: "api"
      resource: "/v1/ledger"
      load_mode: append
      params:
        query_params:
          include_deleted: false
          region: "EMEA"
      schema_file: "ledger.csv"

    transform:
      type: custom
      params:
        script: "src.workflows.finance.currency_conversion"

    load:
      type: clickhouse
      destination: "ledger_entries"
      params:

    # OVERRIDE: Specific archival for this dataset
    archive:
      archive_type: "cas_archive"
      retention_days: 3650 # 10 years for finance

  # DATASET 3: Temporary Log data (No Archival)
  internal_logs:
    partitions:
      column: updated_at
      units: days
      offset: -2
      format: "YYYY-MM-DD"
      wrap_quotes: true
    raw:
      source_type: "api"
      resource: "/v1/logs"
      load_mode: append
      params:
        query_params:
          include_deleted: false
          region: "EMEA"
      schema_file: "logs.csv"

    transform:
      type: custom
      params:
        script: "src.workflows.finance.currency_conversion"

    load:
      type: clickhouse
      destination: "internal_logs"
      params:

    archive:
      enable_archival: false
