# apps/ingestion/config/test_job/config.yaml

# ── Job-level defaults (apply to all datasets in this job) ──────────────────
default:
  job:
    extract:
      service_ref: "file"
    transform:
      type: default
    load:
      service_ref: clickhouse
    num_partitions: 1
    archive:
      enable_archival: true
      service_ref: "standard_archive"

  # ── Datasets (each key = dataset_id, values override job defaults) ─────────
  datasets:
    orders:
      num_partitions: 1          # overrides job-level num_partitions if different
      extract:
        load_mode: "snapshot"    
        source_params:
          filter_sql: ""         # e.g. "WHERE order_date = {{run_date}}"
          bind_params: {}
      transform:
        type: default
        options:
          # column_bitmasks:
          #   order_id: 1
          #   customer_id: 2
          #   order_date: 4
          #   total_amount: 8
          #   status: 16
      load:
        sink_identifier: default.orders
        service_ref: "clickhouse"
      partition_value: "2023-10-27"
      archive:
        enable_archival: true    # per-dataset archival override
        service_ref: "moto_archive"


# ── Local env overrides ──────────────────────────────────────────────────────
local:
  job:
  datasets:
    orders:
      source_identifier: "apps/ingestion/samples/sample_orders.csv"

