# apps/ingestion/config/test_job/config.yaml

# ── Task-level defaults (apply to all datasets in this job) ──────────────────
default:
  job:
    extract:
      service_ref: "file"
    transform:
      type: default
    load:
      service_ref: clickhouse
    num_partitions: 1
    archive:
      enable_archival: true
      service_ref: "standard_archive"

  # ── Datasets (each key = dataset_id, values override job defaults) ─────────
  datasets:
    orders:
      num_partitions: 1          # overrides job-level num_partitions if different
      extract:
        load_mode: "snapshot"    
        source_params:
          filter_sql: ""         # e.g. "WHERE order_date = {{run_date}}"
          bind_params: {}
          schema_file: "schema.csv"
      transform:
        type: default
        options:
      load:
        sink_identifier: test.orders
        service_ref: "clickhouse"
      archive:
        enable_archival: false    # per-dataset archival override
        # service_ref: "s3_archive"


# ── Local env overrides ──────────────────────────────────────────────────────
local:
  job:
  datasets:
    orders:
      source_identifier: "apps/ingestion/samples/sample_orders.csv"

