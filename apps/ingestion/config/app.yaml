version: "1.0"
defaults:
  workspace_dir: "~/.ingestion/data/"
  retention_days: 2555 # 7-year default
  enable_archival: true
  archive_type: "standard_archive"
  num_partitions: 10
  read_mode: "snapshot"


accounts:
  clickhouse:
    local:
      password: "password"
      host: "localhost"
      port: 8123
      user: "default"
      
environments:
  local:
    workspace_dir: "./workspace/"
    archive_base_path: "file:///tmp/archive"
    storage_options:
      region: "us-east-1"
    services:
      clickhouse_db:
        type: "standard_archive"
        account_ref: clickhouse

