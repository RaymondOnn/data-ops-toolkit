version: "1.0"

# --- Configuration Templates ---
x-moto-base: &moto_base
  endpoint_url: "http://localhost:5000" # Matches the port of your moto_server
  key: "testing"
  secret: "testing"
  use_ssl: false
  client_kwargs:
    region_name: "us-east-1"

# Dynaconf environments=True format:
#   - 'default' keys apply to all environments
#   - named env keys (local, production, etc.) override defaults

default:
  workspace_dir: "~/.ingestion/data/"
  retention_days: 2555  # 7-year default
  enable_archival: true
  archive_type: "standard_archive"
  num_partitions: 10

local:
  workspace_dir: "./.workspace/"
  archive_base_path: "file:///tmp/archive"
  storage_options:
    region: "us-east-1"
  secret_provider:
    type: "local_file"
    path: "./.secrets.json"
    master_key: "SECRET_MASTER_KEY" # This can be an env var name or plain text for local dev
  services:
    file:
      type: flat_file
      url: "."
    clickhouse: # Now pointing to a Docker container
      type: clickhouse_db
      host: localhost
      port: 8123
      user: default
      secret_key: CLICKHOUSE_PASSWORD
    ms3:
      type: data_lake
      url: "s3://landing-zone"
      storage_options:
        <<: *moto_base
        use_mock: true # This flag triggers the bucket creation
    s3_sink:
      type: data_lake
      url: "s3://landing-zone"
      storage_options:
        <<: *moto_base
        use_mock: false # Set to true if you want the client to auto-create the bucket on the server
    s3_archive: # Specific archive configuration for the 'local' environment
      type: standard_archive
      url: "s3://landing-zone"
      storage_options:
        <<: *moto_base
        # These options will be passed to the StandardArchiveService's S3Client
        use_mock: true # Auto-create bucket on Moto server

dev:
  services:
    file:
      type: flat_file
    clickhouse: # Now pointing to a Docker container
      type: "clickhouse_db"
      host: "localhost"
      port: 8123
      user: "default"
      secret_key: "CLICKHOUSE_PASSWORD"

