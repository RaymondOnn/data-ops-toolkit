# Dynaconf environments=True format:
#   - 'default' keys apply to all environments
#   - named env keys (local, production, etc.) override defaults

version: "1.0"

default:
  workspace_dir: "./.workspace"
  timezone: "Asia/Singapore"

  # Secret Provider (global, environment-specific)
  secret_provider:
    key: "env_file"           # env_file, aws_secrets_manager, file_encrypted
    secrets_json: "./secrets.json"     # for env_file type
    master_key: "MASTER_KEY"  # for encrypted secrets

  cache:
    key: diskcache
    directory: "@format {this.workspace_dir}/.cache/task_cache"

  task_queue:
    key: diskcache
    directory: "@format {this.workspace_dir}/.cache/task_queue"

  meta_db:
    service_ref: clickhouse

  timeouts:
    total: 45m  # Override the job-level budget
    stage: # Per-stage timeouts
      extract: 20m      # Longer for this specific source
      transform: 15m    # Custom for this task
      load: 25m

local:
  secret_provider:
    key: "local_file"
    secrets_json: "./apps/ingestion/infra/environments/local/.secrets.json"
    # master_key: "SECRET_MASTER_KEY" # This can be an env var name or plain text for local dev

  # archive:
  #   base_path: "s3://archive-vault"

  cache:
    key: diskcache
    directory: "@format {this.workspace_dir}/.cache/task_cache"

  timeouts:
    multiplier: 4.0


dev:
  secret_provider:
    key: aws_secrets_manager
    sm_endpoint_url: "http://${LOCALSTACK_HOST:-localhost}:4566"
    region: "ap-southeast-1"
    sts_endpoint_url: "http://${LOCALSTACK_HOST:-localhost}:4566"
    role_arn: "arn:aws:iam::123456789012:role/DevIngestionRole"



prod:
  secret_provider:
    key: aws_secrets_manager
    sm_endpoint_url: "https://secretsmanager.ap-southeast-1.amazonaws.com"
    region: "ap-southeast-1"
    sts_endpoint_url: "https://sts.us-west-2.amazonaws.com"
    role_arn: "arn:aws:iam::123456789012:role/ProdIngestionRole"
  archive:
    base_path: "s3://prod-vault/archival"
