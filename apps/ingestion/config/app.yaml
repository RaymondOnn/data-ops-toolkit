# Dynaconf environments=True format:
#   - 'default' keys apply to all environments
#   - named env keys (local, production, etc.) override defaults

version: "1.0"

default:
  workspace_dir: "./.workspace"
  timezone: "Asia/Singapore"

  # Secret Provider (global, environment-specific)
  secret_provider:
    type: "env_file"           # env_file, aws_secrets_manager, file_encrypted
    path: "./secrets.json"     # for env_file type
    master_key_env: "MASTER_KEY"  # for encrypted secrets

  cache:
    type: diskcache
    filepath: "@format {this.workspace_dir}/.cache/task_cache"

  task_queue:
    type: diskcache
    filepath: "@format {this.workspace_dir}/.cache/task_queue"

  meta_db:
    service_ref: clickhouse

  timeouts:
    schedule_to_start: 60
    start_to_close: 900
    multiplier: 3.0

local:
  secret_provider:
    type: "local_file"
    path: "./apps/ingestion/infra/environments/local/.secrets.json"
    master_key: "SECRET_MASTER_KEY" # This can be an env var name or plain text for local dev

  # archive:
  #   base_path: "s3://archive-vault"

  cache:
    type: diskcache
    filepath: "@format {this.workspace_dir}/.cache/task_cache"

  timeouts:
    multiplier: 4.0


dev:
  secret_provider:
    type: aws_secrets_manager
    service:
      endpoint_url: "http://${LOCALSTACK_HOST:-localhost}:4566"
    client:
      region: "ap-southeast-1"
      sts_endpoint_url: "http://${LOCALSTACK_HOST:-localhost}:4566"
      role_arn: "arn:aws:iam::123456789012:role/DevIngestionRole"
  services:


prod:
  secret_provider:
    type: aws_secrets_manager
    service:
      endpoint_url: "https://secretsmanager.ap-southeast-1.amazonaws.com"
    client:
      region: "ap-southeast-1"
      sts_endpoint_url: "https://sts.us-west-2.amazonaws.com"
      role_arn: "arn:aws:iam::123456789012:role/ProdIngestionRole"
  archive:
    base_path: "s3://prod-vault/archival"
