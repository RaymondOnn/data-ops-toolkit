# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Use the latest stable version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: job\.yaml$
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500'] # Max file size 500KB

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4 # Use the latest stable version of Ruff
    hooks:
      - id: ruff
        # This will auto-fix linting issues and fail the commit if any fixes were applied.
        # You'll need to `git add .` and re-commit after it fixes things.
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        # This will auto-format your code.
        args: []

